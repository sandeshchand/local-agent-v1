[build-system]
requires =["setuptools>=68", "wheel"]
build-backend= "setuptools.build_meta"

[project]
name = "local-agent-v1"
version= "0.1.0"
description = "Local-first agentic assistant with RAG, MCP, and MCP tools using ollama, Qdrant, SQlite"
readme = "README.md"
requires-python = ">=3.10"
dependencies =[
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "pydantic>=2.8.2",
    "qdrant-client>=1.10.1",
    "pypdf>=6.8.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.1",
]

[project.scripts]
local-agent = "app.main:main"

[project.optional-dependencies]
ocr = [
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.13",
]

[tool.setuptools]
packages =["app","agent","storage","ingestion","ingestion.parsers", "retrieval","observability"]
