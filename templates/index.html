<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/style.css?v=3" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <h1>Local Agent V1</h1>
        <p class="subtitle">Local PDF assistant with RAG</p>
      </div>

      <section class="panel">
        <div class="panel-header">
          <h2>Ingest PDFs</h2>
        </div>

        <div class="stack">
          <input
            id="ingest-path"
            type="text"
            placeholder="Enter a PDF file path or folder path"
          />
          <button id="ingest-btn" type="button">Ingest</button>
        </div>

        <div id="ingest-status" class="status-box muted">
          Enter a file or folder path and click Ingest.
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Indexed Documents</h2>
          <button id="refresh-docs-btn" type="button" class="secondary-btn">Refresh</button>
        </div>

        <div id="documents-list" class="documents-list"></div>
      </section>
    </aside>

    <main class="main-content">
      <section class="chat-header">
        <div>
          <h2>Chat</h2>
          <p>Ask questions about your indexed PDFs.</p>
        </div>
        <div id="chat-status" class="chat-status">Ready</div>
      </section>

      <section id="chat-window" class="chat-window">
        <div class="empty-state" id="empty-state">
          Ask a question like:
          <br />
          <strong>What is Sora and how does it represent the visual world?</strong>
        </div>
      </section>

      <section class="chat-input-bar">
        <textarea
          id="chat-input"
          rows="3"
          placeholder="Ask a question about your documents..."
        ></textarea>
        <button id="send-btn" type="button">Send</button>
      </section>
    </main>
  </div>

  <template id="message-template">
    <div class="message">
      <div class="message-role"></div>
      <div class="message-body"></div>
    </div>
  </template>

  <script src="/static/chat.js?v=3"></script>
</body>
</html>
